apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-cicd-app
  labels:
    app: cloud-cicd-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-cicd-app

  template:
    metadata:
      labels:
        app: cloud-cicd-app

    spec:
      containers:
        - name: cloud-cicd-app
          image: laghancicdregistry.azurecr.io/cloud-cicd-app:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10